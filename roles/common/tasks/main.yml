---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
    state: present

- name: Check whether swap is enabled
  ansible.builtin.command:
    cmd: swapon --show
  register: swap_status
  changed_when: false

- name: Disable swap if enabled
  ansible.builtin.command:
    cmd: swapoff -a
  when: swap_status.stdout != ""

- name: Disable swap permanently
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^\s*([^#]\S+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'


- name: Load required kernel modules
  ansible.builtin.modprobe:
    name: "{{item}}"
    state: present
  loop:
    - overlay
    - br_netfilter
  
- name: Configure Kubernetes kernel modules
  ansible.builtin.template:
    src: kubernetes.conf.j2
    dest: /etc/modules-load.d/kubernetes.conf
    owner: root
    group: root
    mode: '0644'

- name: Configure kubernetes sysctl settings
  ansible.builtin.template:
    src: 99-kubernetes.conf.j2
    dest: /etc/sysctl.d/99-kubernetes.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload sysctl
    