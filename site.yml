---
# ============================================================
# 1. Prepare all Kubernetes nodes
# ============================================================
- name: Prepare Kubernetes nodes
  hosts: k8s_cluster
  become: true

  roles:
    - common
    - containerd
    - kubernetes


# ============================================================
# 2. Configure Kubernetes API HA
# ============================================================
- name: Configure Kubernetes API load balancer
  hosts: control_plane
  become: true

  roles:
    - haproxy
    - keepalived


# ============================================================
# 3. Initialize / configure control plane
# ============================================================
- name: Configure Kubernetes control plane
  hosts: control_plane
  become: true

  roles:
    - control_plane


# ============================================================
# 4. Install Cilium CNI
# ============================================================
- name: Install Cilium CNI
  hosts: control_plane[0]
  become: true

  roles:
    - network


# ============================================================
# 5. Join Kubernetes worker nodes
# ============================================================
- name: Join Kubernetes worker nodes
  hosts: workers
  become: true

  roles:
    - workers
